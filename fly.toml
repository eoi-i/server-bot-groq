# fly.toml app configuration file generated for server-bot-groq on 2026-11-10T15:59:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'server-bot-groq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  LOG_LEVEL = 'INFO'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
