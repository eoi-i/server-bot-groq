app = "globalholmes-ai-bot"
primary_region = "ams"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  LOG_LEVEL = "INFO"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
